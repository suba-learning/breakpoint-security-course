/* ---- SQLi: a tiny boolean-expression evaluator over a user table ---- */
const SQLI_USERS = [
  {username:"admin", password:"s3cr3t-admin"},
  {username:"suba",  password:"correct-horse"},
  {username:"guest", password:"guest"},
];
function sqliEval(expr, row){
  // tokenize
  const toks = []; let i = 0; const s = expr;
  while(i < s.length){
    const c = s[i];
    if(c === " " || c === "\t" || c === "\n"){ i++; continue; }
    if(c === "'"){ let j=i+1, v=""; while(j<s.length && s[j]!=="'"){ v+=s[j]; j++; } if(j>=s.length) throw new Error("unterminated string literal"); toks.push({t:"str", v}); i=j+1; continue; }
    if(c === "("){ toks.push({t:"lp"}); i++; continue; }
    if(c === ")"){ toks.push({t:"rp"}); i++; continue; }
    if(c === "="){ toks.push({t:"eq"}); i++; continue; }
    let j=i, w=""; while(j<s.length && /[A-Za-z0-9_.]/.test(s[j])){ w+=s[j]; j++; }
    if(w === ""){ i++; continue; } // skip stray punctuation
    const up = w.toUpperCase();
    if(up === "AND") toks.push({t:"and"});
    else if(up === "OR") toks.push({t:"or"});
    else toks.push({t:"val", v:w}); // ident or number treated as value
    i = j;
  }
  let p = 0;
  const peek = () => toks[p];
  const eat  = () => toks[p++];
  function operand(){
    const tk = peek();
    if(!tk) throw new Error("unexpected end of expression");
    if(tk.t === "str"){ eat(); return tk.v; }
    if(tk.t === "val"){ eat(); const k = tk.v.toLowerCase(); return (k in row) ? String(row[k]) : tk.v; }
    throw new Error("expected a value");
  }
  function cond(){
    if(peek() && peek().t === "lp"){ eat(); const v = orExpr(); if(peek() && peek().t === "rp") eat(); return v; }
    const left = operand();
    if(peek() && peek().t === "eq"){ eat(); const right = operand(); return left === right; }
    return left !== "" && left !== "0";
  }
  function andExpr(){ let v = cond(); while(peek() && peek().t === "and"){ eat(); v = cond() && v; } return v; }
  function orExpr(){ let v = andExpr(); while(peek() && peek().t === "or"){ eat(); v = andExpr() || v; } return v; }
  const r = orExpr();
  if(p < toks.length) { /* trailing tokens ignored */ }
  return r;
}
function runSqli(){
  const user = document.getElementById("sqli-user").value;
  const pass = document.getElementById("sqli-pass").value;
  const secure = document.getElementById("sqli-secure").checked;
  const qEl = document.getElementById("sqli-query");
  const vEl = document.getElementById("sqli-verdict");
  const template = `SELECT * FROM users WHERE username = '${user}' AND password = '${pass}'`;

  vEl.className = "verdict show";

  if(secure){
    const hit = SQLI_USERS.find(r => r.username === user && r.password === pass);
    qEl.innerHTML = `<span class="key">prepared</span> SELECT * FROM users WHERE username = <span class="pay">?</span> AND password = <span class="pay">?</span>\n<span class="dim">params =</span> [${JSON.stringify(user)}, ${JSON.stringify(pass)}]\n<span class="dim">— input bound as data; it can never become SQL —</span>`;
    if(hit){
      vEl.className = "verdict show safe";
      vEl.innerHTML = `✅ Logged in as <b>${esc(hit.username)}</b> — because the credentials are actually correct. Injection payloads here are treated as a literal (wrong) password and bounce off.`;
    } else {
      vEl.className = "verdict show safe";
      vEl.innerHTML = `🔒 Login failed — injection neutralized. The quote in your input stayed <i>inside</i> the password value instead of breaking out into the query. This is the fix.`;
    }
    return;
  }

  // vulnerable path: substitute, strip comments, evaluate
  let where = template.slice(template.indexOf("WHERE") + 5);
  let cut = where.length;
  const dd = where.indexOf("--"); if(dd >= 0) cut = Math.min(cut, dd);
  const hh = where.indexOf("#");  if(hh >= 0) cut = Math.min(cut, hh);
  const trimmed = where.slice(0, cut);
  const commented = where.slice(cut);

  // pretty-print the query with payload highlighting
  let shown = `SELECT * FROM users WHERE${highlightWhere(trimmed)}`;
  if(commented.trim()) shown += `<span class="dim">${esc(commented)}</span>`;
  qEl.innerHTML = shown;

  let matched = null, err = null;
  try {
    for(const r of SQLI_USERS){ if(sqliEval(trimmed, r)){ matched = r; break; } }
  } catch(e){ err = e.message; }

  if(err){
    vEl.className = "verdict show breached";
    vEl.innerHTML = `💥 <b>HTTP 500 — SQL error:</b> <code>${esc(err)}</code>. The app leaked a database error, which confirms your input reaches the query raw. That error message is itself a finding — and the green light to craft a real injection.`;
  } else if(matched){
    vEl.className = "verdict show breached";
    const injected = (document.getElementById("sqli-pass").value + document.getElementById("sqli-user").value).match(/('|--|\bor\b)/i);
    vEl.innerHTML = `🚨 <b>Authenticated as ${esc(matched.username)}</b> ${injected ? "without a valid password" : ""}. ${matched.username==="admin" ? "You logged in as the first row in the table — the admin." : ""} The <code>WHERE</code> clause resolved to true, so the database returned a user. <b>That's a login bypass.</b>`;
  } else {
    vEl.className = "verdict show neutral";
    vEl.innerHTML = `❌ Invalid credentials — the <code>WHERE</code> clause matched no rows. Try one of the payload chips to make it always-true.`;
  }
}
function highlightWhere(w){
  // escape then color string literals and injection hints
  let out = esc(w);
  out = out.replace(/(&#39;[^&]*?&#39;|'[^']*?')/g, m => `<span class="pay">${m}</span>`);
  out = out.replace(/\b(OR|AND)\b/g, m => `<span class="key">${m}</span>`);
  return out;
}

/* ---- IDOR ---- */
const ORDERS = {
  "1000": {owner:"mira",  item:"Mechanical keyboard", total:"$119.00", address:"Palo Alto, CA"},
  "1001": {owner:"devan", item:"Noise-cancelling headphones", total:"$299.00", address:"Austin, TX"},
  "1002": {owner:"suba",  item:"USB-C hub + cable kit", total:"$54.00", address:"Sunnyvale, CA"},
  "1003": {owner:"priya", item:"Standing desk converter", total:"$220.00", address:"Seattle, WA"},
};
const SESSION_USER = "suba";
function runIdor(){
  const id = document.getElementById("idor-id").value.trim();
  const secure = document.getElementById("idor-secure").checked;
  const out = document.getElementById("idor-out");
  const vEl = document.getElementById("idor-verdict");
  vEl.className = "verdict show";
  const rec = ORDERS[id];

  const reqLine = `<span class="dim">→</span> <span class="key">GET</span> /api/orders/${esc(id)}\n<span class="dim">   Authorization: Bearer &lt;${SESSION_USER}'s token&gt;</span>\n\n`;

  if(!rec){
    out.innerHTML = reqLine + `<span class="bad">HTTP 404 Not Found</span>\n{ "error": "no such order" }`;
    vEl.className = "verdict show neutral";
    vEl.innerHTML = `No order with that ID. Try 1000–1003.`;
    return;
  }
  if(secure && rec.owner !== SESSION_USER){
    out.innerHTML = reqLine + `<span class="ok">HTTP 403 Forbidden</span>\n{ "error": "you do not own this resource" }`;
    vEl.className = "verdict show safe";
    vEl.innerHTML = `🔒 <b>403 — fixed.</b> The server checked that <b>${SESSION_USER}</b> owns order ${esc(id)}, saw it belongs to <b>${esc(rec.owner)}</b>, and refused. This is correct access control.`;
    return;
  }
  // return the record
  out.innerHTML = reqLine + `<span class="${rec.owner===SESSION_USER?"ok":"bad"}">HTTP 200 OK</span>\n{\n  <span class="key">"order_id"</span>: "${esc(id)}",\n  <span class="key">"owner"</span>: "${esc(rec.owner)}",\n  <span class="key">"item"</span>: "${esc(rec.item)}",\n  <span class="key">"total"</span>: "${esc(rec.total)}",\n  <span class="key">"ship_to"</span>: "${esc(rec.address)}"\n}`;
  if(rec.owner === SESSION_USER){
    vEl.className = "verdict show neutral";
    vEl.innerHTML = `✓ That's your own order (${SESSION_USER}). Now change the ID to one you <i>don't</i> own and send again.`;
  } else {
    vEl.className = "verdict show breached";
    vEl.innerHTML = `🚨 <b>IDOR confirmed.</b> You're logged in as <b>${SESSION_USER}</b> but just read <b>${esc(rec.owner)}</b>'s order — name, items, shipping address. No ownership check ran. Flip on "ownership check" to see the fix.`;
  }
}

/* ---- XSS (safe simulation — never injects into the DOM) ---- */
function runXss(){
  const raw = document.getElementById("xss-in").value;
  const secure = document.getElementById("xss-secure").checked;
  const out = document.getElementById("xss-out");
  const vEl = document.getElementById("xss-verdict");
  vEl.className = "verdict show";

  const emitted = secure ? esc(raw) : raw; // what the server writes into the page source
  // display: always escape for safe viewing in our terminal box
  out.innerHTML = `<span class="dim">&lt;div class="results"&gt;</span>\n  <span class="dim">You searched for:</span> ${colorEmitted(emitted, secure)}\n<span class="dim">&lt;/div&gt;</span>`;

  const executes = !secure && wouldExecute(raw);
  if(secure){
    const hadTags = /[<>]/.test(raw);
    vEl.className = "verdict show safe";
    vEl.innerHTML = hadTags
      ? `🔒 <b>Escaped — inert.</b> Your <code>&lt;</code> and <code>&gt;</code> were written as <code>&amp;lt;</code> / <code>&amp;gt;</code>, so the browser shows them as <i>text</i>, not tags. Nothing executes. This is contextual output encoding — the fix.`
      : `🔒 Output is escaped. Even if you add tags, they'll be neutralized. Try a payload chip with escaping on, then off.`;
  } else if(executes){
    vEl.className = "verdict show breached";
    vEl.innerHTML = `🚨 <b>XSS confirmed.</b> The server wrote your payload into the page unescaped, so the browser would parse and run it — firing in the victim's session. <span class="dim">(Simulated: no script actually ran here.)</span> This is how session cookies get stolen.`;
  } else {
    const hadTags = /[<>]/.test(raw);
    vEl.className = "verdict show neutral";
    vEl.innerHTML = hadTags
      ? `⚠️ Your input was reflected raw (a <code>&lt;b&gt;</code> probe would render as real bold — the page isn't escaping). Escalate to an event-handler payload like <code>&lt;img src=x onerror=…&gt;</code> to prove script execution.`
      : `Reflected as plain text. Add a tag to probe whether the page escapes output — try the <code>&lt;b&gt;probe&lt;/b&gt;</code> chip.`;
  }
}
function wouldExecute(s){
  return /<\s*script/i.test(s)
      || /on\w+\s*=/i.test(s)                 // event handlers: onerror, onload...
      || /<\s*(img|svg|iframe|body|video|audio|details|object|embed)[^>]*\bon\w+/i.test(s)
      || /javascript\s*:/i.test(s);
}
function colorEmitted(emitted, secure){
  if(secure) return `<span class="ok">${emitted}</span>`; // already escaped text
  // emitted is raw; show it escaped-for-display but tinted as "live markup"
  return `<span class="pay">${esc(emitted)}</span>`;
}

/* ---- JWT ---- */
function b64urlEncode(obj){
  const json = JSON.stringify(obj);
  return btoa(json).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64urlDecode(str){
  try {
    let s = str.replace(/-/g,"+").replace(/_/g,"/");
    while(s.length % 4) s += "=";
    return JSON.parse(atob(s));
  } catch { return null; }
}
const JWT_SECRET_SIG = "VALIDSIG-server-signed-xyz"; // stand-in for an HMAC signature
function makeDemoJwt(role){
  const header = {alg:"HS256", typ:"JWT"};
  const payload = {sub:"suba", role: role || "user", iat: 1730000000};
  return `${b64urlEncode(header)}.${b64urlEncode(payload)}.${JWT_SECRET_SIG}`;
}
function setJwtRole(role){
  const el = document.getElementById("jwt-in");
  const parts = el.value.split(".");
  const payload = (parts.length===3 && b64urlDecode(parts[1])) || {sub:"suba", iat:1730000000};
  payload.role = role;
  // forging the payload but keeping the OLD signature (attacker can't recompute it)
  el.value = `${parts[0]||b64urlEncode({alg:"HS256",typ:"JWT"})}.${b64urlEncode(payload)}.${parts[2]||JWT_SECRET_SIG}`;
  runJwt();
}
function runJwt(){
  const el = document.getElementById("jwt-in");
  const verify = document.getElementById("jwt-secure").checked;
  const out = document.getElementById("jwt-out");
  const vEl = document.getElementById("jwt-verdict");
  vEl.className = "verdict show";
  const parts = el.value.split(".");
  if(parts.length !== 3){
    out.innerHTML = `<span class="bad">Not a valid JWT (need header.payload.signature).</span>`;
    vEl.className = "verdict show neutral";
    vEl.innerHTML = `A JWT has three dot-separated parts. Use a role chip to generate one.`;
    return;
  }
  const header = b64urlDecode(parts[0]);
  const payload = b64urlDecode(parts[1]);
  if(!header || !payload){
    out.innerHTML = `<span class="bad">Could not decode the token.</span>`;
    vEl.className = "verdict show neutral"; vEl.innerHTML = "Decode failed — regenerate with a role chip.";
    return;
  }
  out.innerHTML =
    `<span class="dim">// header (Base64 — anyone can read this)</span>\n<span class="key">${esc(JSON.stringify(header,null,2))}</span>\n\n` +
    `<span class="dim">// payload (Base64 — NOT encrypted)</span>\n<span class="pay">${esc(JSON.stringify(payload,null,2))}</span>\n\n` +
    `<span class="dim">// signature</span>\n${esc(parts[2])}`;

  const sigValid = parts[2] === JWT_SECRET_SIG;
  const roleAdmin = payload.role === "admin";

  if(verify){
    if(sigValid){
      vEl.className = "verdict show safe";
      vEl.innerHTML = `🔒 <b>Signature valid.</b> The server recomputed the signature over the payload and it matched, so it trusts <code>role=${esc(String(payload.role))}</code>. You can <i>read</i> the token, but any change would invalidate this signature.`;
    } else {
      vEl.className = "verdict show safe";
      vEl.innerHTML = `🔒 <b>Rejected — HTTP 401.</b> You changed the payload${roleAdmin?" to <code>role=admin</code>":""}, but you can't recompute the signature without the server's secret key. The server recomputed it, saw the mismatch, and threw out your forged token. <b>This is why signing works.</b>`;
    }
  } else {
    if(roleAdmin && !sigValid){
      vEl.className = "verdict show breached";
      vEl.innerHTML = `🚨 <b>Privilege escalation.</b> Signature verification is off, so the server trusted your edited payload — you're now <code>role=admin</code> with a forged token. This is the real-world "alg:none / unverified signature" bug.`;
    } else {
      vEl.className = "verdict show breached";
      vEl.innerHTML = `⚠️ Signature not verified — the server trusts whatever the payload says (<code>role=${esc(String(payload.role))}</code>). Set the role to <b>admin</b> to escalate, since nothing checks the signature.`;
    }
  }
}
